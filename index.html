<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HOME SCREEN ===== -->
<div id="screen-home" class="screen active">
  <header class="app-header">
    <h1>Gym Tracker</h1>
    <button class="icon-btn" id="btn-settings" aria-label="Impostazioni">&#9881;</button>
  </header>

  <div class="session-grid" id="session-grid">
    <!-- populated by JS -->
  </div>

  <div class="home-actions">
    <button class="free-btn" id="btn-free-workout">
      <span class="free-icon">+</span>
      Allenamento libero
    </button>
    <button class="storico-btn" id="btn-storico">
      <span>&#128200;</span>
      Storico
    </button>
  </div>
</div>

<!-- ===== EXERCISE LIST (after choosing session) ===== -->
<div id="screen-workout" class="screen">
  <header class="app-header">
    <button class="icon-btn back-btn" id="btn-back-home" aria-label="Indietro">&#8592;</button>
    <h2 id="workout-title">Day 1 — PUSH</h2>
    <button class="icon-btn" id="btn-finish-workout" title="Termina">&#10003;</button>
  </header>

  <div class="session-progress-bar" id="session-progress-bar">
    <div class="session-progress-fill" id="session-progress-fill"></div>
  </div>

  <div class="ex-list" id="ex-list">
    <!-- populated by JS -->
  </div>
</div>

<!-- ===== EXERCISE DETAIL (logging sets) ===== -->
<div id="screen-exercise" class="screen">
  <header class="app-header">
    <button class="icon-btn back-btn" id="btn-back-to-list" aria-label="Indietro">&#8592;</button>
    <h2 id="ex-detail-name" class="ex-detail-name-header"></h2>
    <button class="icon-btn" id="btn-ex-chart" title="Storico" aria-label="Grafico progressione">&#128200;</button>
  </header>

  <div class="exercise-card">
    <div class="exercise-header">
      <div class="ex-target" id="ex-detail-target"></div>
      <div class="ex-note" id="ex-detail-note"></div>
    </div>

    <div class="last-session" id="ex-detail-last">
      <!-- last session reference -->
    </div>

    <div class="sets-log" id="ex-detail-sets-log"></div>

    <button class="add-set-btn" id="btn-add-set">+ Aggiungi serie</button>

    <div class="rest-timer" id="rest-timer" hidden>
      <div class="rest-label">Riposo</div>
      <div class="rest-countdown" id="rest-countdown">2:00</div>
      <div class="rest-adjust">
        <button class="rest-adj-btn" data-delta="-30">-30s</button>
        <button class="rest-adj-btn" data-delta="-15">-15s</button>
        <button class="rest-adj-btn" data-delta="15">+15s</button>
        <button class="rest-adj-btn" data-delta="30">+30s</button>
      </div>
      <button class="rest-skip" id="btn-skip-rest">Salta</button>
    </div>
  </div>
</div>

<!-- ===== STORICO ESERCIZI ===== -->
<div id="screen-storico" class="screen">
  <header class="app-header">
    <button class="icon-btn back-btn" id="btn-back-from-storico">&#8592;</button>
    <h2>Storico esercizi</h2>
  </header>
  <div class="storico-search-bar">
    <input type="text" id="storico-search" class="settings-input" placeholder="Cerca esercizio...">
  </div>
  <div class="storico-list" id="storico-list"></div>
</div>

<!-- ===== HISTORY / PROGRESSIONE GRAFICO ===== -->
<div id="screen-history" class="screen">
  <header class="app-header">
    <button class="icon-btn back-btn" id="btn-back-from-history" aria-label="Indietro">&#8592;</button>
    <h2 id="history-title">Progressione</h2>
  </header>
  <div class="history-content" id="history-content"></div>
</div>

<!-- ===== FREE WORKOUT SCREEN ===== -->
<div id="screen-free" class="screen">
  <header class="app-header">
    <button class="icon-btn back-btn" id="btn-back-from-free">&#8592;</button>
    <h2>Allenamento libero</h2>
    <button class="icon-btn" id="btn-finish-free">&#10003;</button>
  </header>
  <div class="free-content">
    <div class="sets-log" id="free-log"></div>
    <button class="add-set-btn" id="btn-add-free-exercise">+ Aggiungi esercizio</button>
  </div>
</div>

<!-- ===== SETTINGS SCREEN ===== -->
<div id="screen-settings" class="screen">
  <header class="app-header">
    <button class="icon-btn back-btn" id="btn-back-from-settings">&#8592;</button>
    <h2>Impostazioni</h2>
  </header>
  <div class="settings-content">
    <div class="settings-group">
      <label class="settings-label">GitHub Token (PAT)</label>
      <input type="password" id="input-token" class="settings-input" placeholder="ghp_...">
      <p class="settings-hint">Token con scope <code>repo</code> — salvato solo su questo dispositivo</p>
    </div>
    <div class="settings-group">
      <label class="settings-label">Repository</label>
      <input type="text" id="input-repo" class="settings-input" placeholder="username/gym-tracker">
    </div>
    <button class="save-btn" id="btn-save-settings">Salva</button>
    <div class="settings-status" id="settings-status"></div>
    <hr class="divider">
    <h3 class="settings-section-title">Statistiche</h3>
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</div>

<!-- ===== MODALS ===== -->
<div id="modal-overlay" class="modal-overlay hidden">
  <!-- Set input modal -->
  <div id="modal-set" class="modal">
    <h3 class="modal-title">Salva serie</h3>
    <div class="modal-body">
      <div class="input-group">
        <label>Peso (kg)</label>
        <div class="weight-grid">
          <button class="num-btn" data-target="modal-kg" data-delta="-2.5">-2.5</button>
          <input type="number" id="modal-kg" class="number-input weight-input" value="0" min="0" step="0.5">
          <button class="num-btn" data-target="modal-kg" data-delta="2.5">+2.5</button>
          <button class="num-btn secondary" data-target="modal-kg" data-delta="-5">-5</button>
          <button class="num-btn secondary" data-target="modal-kg" data-delta="-1.25">-1.25</button>
          <button class="num-btn secondary" data-target="modal-kg" data-delta="1.25">+1.25</button>
          <button class="num-btn secondary" data-target="modal-kg" data-delta="5">+5</button>
        </div>
      </div>
      <div class="input-group">
        <label>Ripetizioni</label>
        <div class="number-input-row">
          <button class="num-btn" data-target="modal-reps" data-delta="-1">-1</button>
          <input type="number" id="modal-reps" class="number-input" value="8" min="1" step="1">
          <button class="num-btn" data-target="modal-reps" data-delta="1">+1</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" id="btn-modal-cancel">Annulla</button>
      <button class="modal-confirm" id="btn-modal-confirm">Conferma</button>
    </div>
  </div>

  <!-- Exercise picker modal (free workout) -->
  <div id="modal-picker" class="modal hidden">
    <h3 class="modal-title">Scegli esercizio</h3>
    <input type="text" id="picker-search" class="settings-input" placeholder="Cerca...">
    <div class="picker-list" id="picker-list"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="btn-picker-cancel">Annulla</button>
    </div>
  </div>

  <!-- Confirm finish modal -->
  <div id="modal-confirm-finish" class="modal hidden">
    <h3 class="modal-title">Termina allenamento?</h3>
    <p class="modal-text" id="modal-finish-text"></p>
    <div class="modal-actions">
      <button class="modal-cancel" id="btn-finish-cancel">Continua</button>
      <button class="modal-confirm" id="btn-finish-confirm">Salva e chiudi</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
